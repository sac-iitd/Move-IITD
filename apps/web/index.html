<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MoveIITD — book the IIT Delhi ↔ Sonipat campus shuttle (Student Affairs Council)."
    />
    <meta name="theme-color" content="#2a1714" />
    <link rel="icon" type="image/png" href="/sac-logo.png" />
    <title>MoveIITD</title>
    <style>
      /* Shown before the app's JavaScript loads; React replaces #root's content on start. */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #2a1714;
        color: #d9ae5c;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      #boot img {
        width: 96px;
        height: 96px;
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      #boot .bar {
        width: 140px;
        height: 3px;
        border-radius: 3px;
        background: rgba(217, 174, 92, 0.25);
        overflow: hidden;
      }
      #boot .bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        background: #d9ae5c;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        50% {
          transform: scale(1.06);
          opacity: 0.85;
        }
      }
      @keyframes boot-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot img,
        #boot .bar::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" role="status" aria-label="Loading MoveIITD">
        <img src="/sac-logo.png" alt="" width="96" height="96" />
        <strong style="letter-spacing: 0.06em">MoveIITD</strong>
        <div class="bar"></div>
      </div>
    </div>
    <noscript>
      <div
        style="
          padding: 24px;
          font-family: system-ui, sans-serif;
          background: #fbf6ee;
          color: #2a1714;
        "
      >
        MoveIITD needs JavaScript to run. Please enable JavaScript in your browser and reload the
        page.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
